<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/cards.css">
<link rel="stylesheet" href="../assets/css/buttons.css">
<link rel="stylesheet" href="../assets/css/progress.css">
<link rel="stylesheet" href="../assets/css/grade.css">

<title>Grade 1</title>

</head>

<body>

<div class="container">

<a class="back-home" href="../index.html">
← Back to Home
</a>


<!-- =========================
     HEADER
========================= -->

<header class="hero">

<h1>📘 Grade 1</h1>

<p class="subtitle">
Oxford Discover Futures
</p>

</header>


<!-- =========================
     PROGRESS
========================= -->

<div class="progress-card">

<h2>Homework Progress</h2>

<p id="overallProgress">
0 / 12 Units Completed
</p>

</div>


<!-- =========================
     UNITS
========================= -->

<h2 class="section-title">
Choose a Unit
</h2>

<div id="unitList" class="cards">

</div>


<!-- =========================
     ASSESSMENTS
========================= -->

<h2 class="section-title">
Assessments
</h2>

<div id="assessmentList" class="cards">


<!-- MIDTERM -->

<a
    class="unit-card assessment-card"
    href="../games/assessment/index.html?grade=1&type=midterm"
>

<div class="unit-number">
📝 Midterm Exam
</div>

<h3>
Units 1–4
</h3>

<p>
Test what you have learned in Units 1–4
</p>

<span>
Start Exam →
</span>

</a>


<!-- FINAL -->

<a
    class="unit-card assessment-card"
    href="../games/assessment/index.html?grade=1&type=final"
>

<div class="unit-number">
🏆 Final Exam
</div>

<h3>
Units 1–12
</h3>

<p>
Review what you have learned throughout the course
</p>

<span>
Start Exam →
</span>

</a>


</div>

</div>


<!-- =========================
     LOAD UNITS
========================= -->

<script>

const grade = 1;

fetch(`../assets/data/grade${grade}/units.json`)

.then(response => {

    if (!response.ok) {

        throw new Error(
            `Unable to load units.json: ${response.status}`
        );

    }

    return response.json();

})

.then(units => {

    const container =
        document.getElementById("unitList");

    container.innerHTML = "";

    units.forEach(unit => {

        const card =
            document.createElement("a");

        card.className =
            "unit-card";

        card.href =
            `unit.html?unit=${unit.id}`;

        card.innerHTML = `

            <div class="unit-number">
                📖 Unit ${unit.id}
            </div>

            <h3>
                ${unit.title}
            </h3>

            <p>
                Vocabulary • Games • Listening
            </p>

            <span>
                Start Learning →
            </span>

        `;

        container.appendChild(card);

    });

})

.catch(error => {

    console.error(
        "Failed to load units:",
        error
    );

});

</script>

</body>
</html>
